name: Release

# Cut a release by pushing a semver tag, e.g.  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # create the GitHub Release + upload the APK
    steps:
      - uses: actions/checkout@v7

      - name: Set up the declared Gradle daemon JDK
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Derive version from tag
        id: v
        run: |
          set -euo pipefail
          # Two decimal digits per minor/patch component preserve versionCode uniqueness.
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::Expected vMAJOR.MINOR.PATCH with minor/patch below 100'
            exit 1
          fi
          NAME="${GITHUB_REF_NAME#v}"                 # v1.2.3 -> 1.2.3
          BASE="${NAME%%-*}"                          # drop any -suffix for the numeric code
          IFS='.' read -r MAJ MIN PAT <<< "$BASE"
          CODE=$(( ${MAJ:-0} * 10000 + ${MIN:-0} * 100 + ${PAT:-0} ))
          if (( CODE < 1 || CODE > 2100000000 )); then
            echo '::error::Tag produces a versionCode outside the Android range'
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building Baton $NAME (versionCode $CODE)"

      - name: Materialise release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Release keystore is required}"
          : "${STORE_PASSWORD:?Release store password is required}"
          : "${KEY_ALIAS:?Release key alias is required}"
          : "${KEY_PASSWORD:?Release key password is required}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify and build signed release APK
        env:
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          ./gradlew assembleDebug test lintDebug lintRelease assembleRelease \
            "-Pbaton.versionName=$VERSION_NAME" \
            "-Pbaton.versionCode=$VERSION_CODE" --stacktrace

      - name: Remove temporary signing material
        if: always()
        run: rm -f -- keystore.properties "$RUNNER_TEMP/release.keystore"

      - name: Retain test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            **/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Baton ${{ steps.v.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/app-release.apk
